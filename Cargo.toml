[workspace]
resolver = "2"
members = [
    "crates/podbridge-crypto",
    "crates/podbridge-itdb",
    "crates/podbridge-artwork",
    "crates/podbridge-device",
    "crates/podbridge-pipeline",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/monoguitari/PodBridge"

[workspace.dependencies]
podbridge-artwork = { path = "crates/podbridge-artwork" }
podbridge-crypto = { path = "crates/podbridge-crypto" }
podbridge-itdb = { path = "crates/podbridge-itdb" }

aes = "0.8"
byteorder = "1.5"
encoding_rs = "0.8"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
plist = "1.7"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2.0"

windows = { version = "0.58", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[workspace.lints.rust]
unexpected_cfgs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
