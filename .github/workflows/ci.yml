name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-and-windows:
    name: Rust Core, UI & Windows Tauri Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Run Clippy on Core Workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Core Unit & Integration Tests
        run: cargo test --workspace
      - name: Typecheck, Test & Build UI
        working-directory: ui
        run: |
          npm ci
          npm run typecheck
          npm run test
          npm run build
      - name: Install cargo-xwin, LLVM & LGPL FFmpeg sidecar
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld llvm nsis unzip
          curl -sSL https://github.com/rust-cross/cargo-xwin/releases/download/v0.23.1/cargo-xwin-v0.23.1.x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C "$HOME/.cargo/bin"
          chmod +x scripts/fetch-ffmpeg-win64.sh
          ./scripts/fetch-ffmpeg-win64.sh
      - name: Cross-check Windows Tauri Application
        run: |
          cargo xwin clippy --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings
          cargo xwin clippy --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc -- -D warnings
